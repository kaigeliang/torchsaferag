seed: 42
paths:
  raw_dir: data/raw
  processed_dir: data/processed
  embeddings_dir: embeddings
  indexes_dir: indexes
  eval_dir: eval
chunking:
  method: structured
  max_tokens: 220
  overlap: 20
embedding:
  model_name: BAAI/bge-base-en
  batch_size: 32
retrieval:
  bm25:
    use_pyserini: false
  dense:
    index_type: flat
  hybrid:
    alpha: 0.5
  rerank:
    enabled: false
    model_name: BAAI/bge-reranker-base
    top_n: 10
generation:
  provider: siliconflow
  api_base: https://api.siliconflow.cn/v1/chat/completions
  api_key_env: SILICONFLOW_API_KEY
  model_name: Qwen/Qwen2.5-7B-Instruct
  model_path: null
  context_window: 4096
  temperature: 0.7
  top_k: 40
  max_new_tokens: 256
  prompt_style: strict
evaluation:
  judge_model: gpt-4o-mini
  judge_provider: openai
  judge_api_key_env: OPENAI_API_KEY
  judge_api_base_env: OPENAI_API_BASE
  num_judge_samples: 30
  qa_file: eval/qa.jsonl
  hallucination:
    sentence_split_regex: '[.!?\u3002\uff1f\uff01]'
