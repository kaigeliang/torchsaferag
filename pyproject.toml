[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torchsaferag"
version = "0.1.0"
description = "Safety-aware retrieval-augmented generation over PyTorch documentation and AI safety papers."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Kaige Liang" }
]
keywords = ["rag", "retrieval", "faiss", "safety", "pytorch"]
dependencies = [
  "torch==2.8.0",
  "torchvision==0.23.0",
  "torchaudio==2.8.0",
  "faiss-cpu==1.12.0",
  "transformers==4.57.1",
  "sentence-transformers==3.0.1",
  "accelerate==1.11.0",
  "openai==2.8.1",
  "httpx>=0.27.0",
  "requests>=2.32.0",
  "rank-bm25==0.2.2",
  "pandas==2.3.0",
  "pyarrow>=16.0.0",
  "numpy==1.26.4",
  "scikit-learn==1.7.2",
  "pyyaml==6.0.2",
  "typer>=0.12.0",
  "tqdm>=4.66.0",
  "rich>=13.7.0",
  "pypdf>=5.0.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0.0",
  "matplotlib==3.9.2",
  "seaborn>=0.13.0"
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
